name: Release CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run Go Unit Tests
        run: |
          go test -v ./...

      - name: Build Pre-compiled Binaries for Multiple OS/Arch
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o coding_agent_app_linux_amd64 main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o coding_agent_app_linux_arm64 main.go
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o coding_agent_app_darwin_amd64 main.go
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o coding_agent_app_darwin_arm64 main.go

      - name: Create Release Tarball
        run: |
          tar -czvf coding_agent_web_linux_amd64.tar.gz coding_agent_app_linux_amd64 config.example.json install.sh README.md

      - name: Create GitHub Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            coding_agent_app_linux_amd64
            coding_agent_app_linux_arm64
            coding_agent_app_darwin_amd64
            coding_agent_app_darwin_arm64
            coding_agent_web_linux_amd64.tar.gz
          name: Latest Release (Auto Build)
          body: |
            ## 🎉 Latest Release - AI Kurikulum Koding & AI Web Application

            ### ⚡ Fast One-Line Installer:
            ```bash
            curl -fsSL "https://raw.githubusercontent.com/sodikinnaa/coding-agent-web/main/install.sh?v=$(date +%s)" | bash
            ```
          draft: false
          prerelease: false
